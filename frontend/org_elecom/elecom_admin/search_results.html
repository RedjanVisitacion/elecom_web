<!DOCTYPE html>

<head>

    <link rel="shortcut icon" type="image/png" href="/static/assets/elecom.png?v=3">
    <link rel="apple-touch-icon" href="/static/assets/elecom.png?v=3">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/org_elecom/elecom_admin/admin_components/admin_css/admin_dashboard.css?v=20261004-search-appbar">
    <style>
        .search-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 16px 24px;
        }
        .search-hero-logo {
            width: 52px; height: 52px;
            margin-bottom: 16px;
            opacity: .85;
        }
        .search-hero-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--blue-900);
            margin-bottom: 24px;
            letter-spacing: -.01em;
        }
        .search-hero-box {
            width: 100%;
            max-width: 620px;
            position: relative;
        }
        .search-hero-input-wrap {
            display: flex;
            align-items: center;
            background: #fff;
            border: 2px solid var(--gray-200);
            border-radius: 999px;
            padding: 10px 20px;
            gap: 10px;
            box-shadow: 0 2px 12px rgba(10,36,99,.08);
            transition: border-color .18s, box-shadow .18s;
        }
        .search-hero-input-wrap:focus-within {
            border-color: var(--blue-600);
            box-shadow: 0 4px 20px rgba(10,36,99,.14);
        }
        .search-hero-input-wrap i {
            color: var(--gray-400);
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .search-hero-input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 1rem;
            background: transparent;
            color: var(--gray-900);
        }
        .search-hero-input::placeholder { color: var(--gray-400); }
        .search-hero-clear {
            background: none; border: none; padding: 0;
            color: var(--gray-400); cursor: pointer;
            display: none;
            line-height: 1;
        }
        .search-hero-clear:hover { color: var(--gray-700); }

        /* Results list */
        .search-results-box {
            width: 100%;
            max-width: 620px;
            margin-top: 8px;
        }
        .search-result-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: #fff;
            border-radius: var(--radius-md);
            border: 1px solid var(--gray-100);
            cursor: pointer;
            text-decoration: none;
            color: var(--gray-900);
            transition: background .14s, box-shadow .14s;
            margin-bottom: 6px;
        }
        .search-result-item:hover {
            background: #f0f4ff;
            box-shadow: 0 2px 8px rgba(10,36,99,.08);
            color: var(--gray-900);
        }
        .search-result-avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gray-100);
            flex-shrink: 0;
        }
        .search-result-avatar-placeholder {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: var(--gray-100);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 1.2rem;
            color: var(--gray-400);
        }
        .search-result-name { font-weight: 600; font-size: .95rem; }
        .search-result-meta { font-size: .8rem; color: var(--gray-500); margin-top: 2px; }
        .search-result-party {
            margin-left: auto;
            font-size: .75rem;
            color: var(--gray-400);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .search-status {
            text-align: center;
            color: var(--gray-400);
            font-size: .9rem;
            padding: 24px 0;
        }
        .search-count-label {
            font-size: .8rem;
            color: var(--gray-400);
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>

                    <img src="/static/assets/elecom.png" alt="ELECOM Logo">
                    <img class="wordmark" src="/static/assets/img_text/elecom_white1.png" alt="Electoral Commission">
                </div>
                <button class="btn-close-sidebar" id="closeSidebar"><i class="bi bi-x-lg"></i></button>
            </div>
        </div>
        <div class="sidebar-menu">

                <li class="nav-item"><a class="nav-link" href="/static/org_elecom/elecom_admin/elecom_elections.html"><i class="bi bi-calendar2-range"></i><span>Election Management</span></a></li>
                <li class="nav-item">
                    <a class="nav-link" href="#candidatesSubmenu" data-bs-toggle="collapse" role="button" aria-expanded="false" aria-controls="candidatesSubmenu">
                        <i class="bi bi-people"></i><span>Candidates</span><i class="bi bi-chevron-right chevron ms-auto"></i>
                    </a>
                    <div class="collapse" id="candidatesSubmenu">
                        <ul class="nav flex-column ps-3">
                            <li class="nav-item"><a class="dropdown-item" href="/static/org_elecom/elecom_admin/elecom_candidates.html" onclick="sessionStorage.setItem('elecom_candidates_org_filter','USG')"><img src="/static/assets/org_logos/USG_LOGO.png" class="sidebar-org-logo me-1" alt="USG">USG</a></li>
                            <li class="nav-item"><a class="dropdown-item" href="/static/org_elecom/elecom_admin/elecom_candidates.html" onclick="sessionStorage.setItem('elecom_candidates_org_filter','SITE')"><img src="/static/assets/org_logos/SITE_LOGO.png" class="sidebar-org-logo me-1" alt="SITE">SITE</a></li>
                            <li class="nav-item"><a class="dropdown-item" href="/static/org_elecom/elecom_admin/elecom_candidates.html" onclick="sessionStorage.setItem('elecom_candidates_org_filter','PAFE')"><img src="/static/assets/org_logos/PAFE_LOGO.png" class="sidebar-org-logo me-1" alt="PAFE">PAFE</a></li>
                            <li class="nav-item"><a class="dropdown-item" href="/static/org_elecom/elecom_admin/elecom_candidates.html" onclick="sessionStorage.setItem('elecom_candidates_org_filter','AFPROTECHS')"><img src="/static/assets/org_logos/AFPROTECHS_LOGO.png" class="sidebar-org-logo me-1" alt="AFPROTECHS">AFPROTECHS</a></li>
                        </ul>
                    </div>
                </li>
                <li class="nav-item"><a class="nav-link" href="/static/org_elecom/elecom_admin/elecom_results.html"><i class="bi bi-graph-up"></i><span>Results</span></a></li>
                <li class="nav-item"><a class="nav-link" href="/static/org_elecom/elecom_admin/elecom_reports.html"><i class="bi bi-file-earmark-bar-graph"></i><span>Generate Reports</span></a></li>
                <li class="nav-item"><a class="nav-link" href="/static/org_elecom/elecom_admin/elecom_backup_restore.html"><i class="bi bi-database"></i><span>Backup &amp; Restore</span></a></li>

                <li class="nav-item"><a class="nav-link" href="/static/org_elecom/elecom_admin/elecom_network_authorize.html"><i class="bi bi-wifi"></i><span>Network Authorize</span></a></li>
            </ul>
        </div>
    </div>

    <div class="main-content">
        <nav class="top-navbar">
            <button class="menu-toggle" id="menuToggle"><i class="bi bi-list"></i></button>
            <div id="userMenuMount"></div>
        </nav>

        <div class="content-area">
            <!-- Hero search -->
            <div class="search-hero">
                <img src="/static/assets/elecom.png" alt="ELECOM" class="search-hero-logo">
                <div class="search-hero-title">Search Candidates</div>

                <div class="search-hero-box">
                    <div class="search-hero-input-wrap">
                        <i class="bi bi-search"></i>
                        <input id="searchInput" type="text" class="search-hero-input"
                               placeholder="Search by name, ID, position, or organization..."
                               autocomplete="off" autofocus>
                        <button class="search-hero-clear" id="searchClear" aria-label="Clear">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Results appear below search box -->
                <div class="search-results-box">
                    <div id="searchStatus" class="search-status" style="display:none;"></div>
                    <div id="searchCount" class="search-count-label" style="display:none;"></div>
                    <div id="searchList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Candidate Profile Modal -->
    <div class="modal fade" id="candidateModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="d-flex align-items-center gap-3">
                        <img id="cd_photo" src="" alt="Profile"
                             class="rounded-circle border"
                             style="width:52px;height:52px;object-fit:cover;display:none;">
                        <div>
                            <h5 class="modal-title mb-0" id="cd_name_title">Candidate Details</h5>
                            <div class="small text-muted" id="cd_org_title"></div>
                        </div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="cd_name" readonly>
                                <label>Full Name</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="cd_student_id" readonly>
                                <label>Student ID</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="cd_position" readonly>
                                <label>Position</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="cd_org" readonly>
                                <label>Organization</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="cd_party" readonly>
                                <label>Party</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="cd_program" readonly>
                                <label>Program</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="cd_year" readonly>
                                <label>Year / Section</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Platform</label>
                            <div class="p-3 border rounded bg-light" id="cd_platform" style="min-height:64px; white-space:pre-wrap;"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
